name: Trigger FinanceWiki Windows 1.0.3 updater

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-windows-1.0.3.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, 'trigger Windows 1.0.3 updater')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production updater workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-financewiki.yml \
            --repo financewiki-park/financewiki-updates \
            -f app_ref=6dd559abea2b3e18bc9b455992f2ab93ed7e6196
