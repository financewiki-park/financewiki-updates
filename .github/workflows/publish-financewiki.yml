name: Publish FinanceWiki Windows updater

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: financewiki-app ref to release
        required: true
        default: main
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-financewiki.yml"

permissions:
  contents: write

concurrency:
  group: financewiki-production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
      missing: ${{ steps.secrets.outputs.missing }}
      app_sha: ${{ steps.source.outputs.app_sha }}
      app_version: ${{ steps.source.outputs.app_version }}
    env:
      APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Check release credentials without exposing values
        id: secrets
        shell: bash
        run: |
          missing=()
          for name in APP_REPO_TOKEN TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${missing[*]}")
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=$joined" >> "$GITHUB_OUTPUT"
            echo "Production publishing is blocked until these repository secrets exist: $joined"
          fi

      - name: Checkout private app source
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: financewiki-park/financewiki-app
          ref: ${{ github.event.inputs.app_ref || 'main' }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app

      - name: Pin one immutable app commit and version
        if: steps.secrets.outputs.ready == 'true'
        id: source
        shell: bash
        run: |
          app_sha=$(git -C app rev-parse HEAD)
          version=$(node -p 'require("./app/package.json").version')
          echo "app_sha=$app_sha" >> "$GITHUB_OUTPUT"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned financewiki-app $app_sha (v$version)"

  blocked:
    needs: preflight
    if: needs.preflight.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report credential blocker
        run: |
          echo "Windows updater release is blocked until signing/access is configured."
          echo "Missing repository secrets: ${{ needs.preflight.outputs.missing }}"
          echo "No updater release was published and no signature checks were bypassed."

  build-windows:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: windows-2022
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: financewiki-park/financewiki-app
          ref: ${{ needs.preflight.outputs.app_sha }}
          token: ${{ secrets.APP_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm test
      - run: npm run release:updater-check
      - run: npm run tauri -- build --bundles nsis

      - name: Stage Windows updater
        shell: pwsh
        run: |
          $version = "${{ needs.preflight.outputs.app_version }}"
          $source = "src-tauri/target/release/bundle/nsis/FinanceWiki_${version}_x64-setup.exe"
          if (!(Test-Path $source) -or !(Test-Path "$source.sig")) { throw "Windows updater artifact/signature missing" }
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item $source staging/
          Copy-Item "$source.sig" staging/

      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-x86_64
          path: staging/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [preflight, build-windows]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: financewiki-park/financewiki-app
          ref: ${{ needs.preflight.outputs.app_sha }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: dist
          merge-multiple: true

      - name: Build Windows updater manifest
        shell: bash
        run: |
          version="${{ needs.preflight.outputs.app_version }}"
          windows="dist/FinanceWiki_${version}_x64-setup.exe"
          node app/scripts/create-update-manifest.mjs \
            --platform windows-x86_64 \
            --artifact "$windows" \
            --signature "$windows.sig" \
            --output dist/latest.json
          node -e 'const m=require("./dist/latest.json"); const p=Object.keys(m.platforms); if(!p.includes("windows-x86_64")||p.length!==1) process.exit(1); console.log(m.version,p.join(","))'
          sha256sum dist/FinanceWiki_* dist/latest.json > dist/artifact-sha256.txt

      - name: Publish immutable updater release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ needs.preflight.outputs.app_version }}"
          tag="v${version}"
          if gh release view "$tag" --repo financewiki-park/financewiki-updates >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite immutable updater assets." >&2
            exit 1
          fi
          gh release create "$tag" \
            --repo financewiki-park/financewiki-updates \
            --title "FinanceWiki $tag" \
            --notes "financewiki-app ${{ needs.preflight.outputs.app_sha }}. Windows x64 updater artifact built from this immutable source commit. macOS distribution is intentionally deferred." \
            dist/FinanceWiki_* \
            dist/latest.json \
            dist/artifact-sha256.txt

      - name: Verify latest endpoint exposes Windows updater
        shell: bash
        run: |
          sleep 5
          curl -fsSL "https://github.com/financewiki-park/financewiki-updates/releases/latest/download/latest.json" -o published-latest.json
          node -e 'const m=require("./published-latest.json"); const p=Object.keys(m.platforms); if(m.version!=="${{ needs.preflight.outputs.app_version }}"||!p.includes("windows-x86_64")||p.length!==1) process.exit(1); console.log("Published updater manifest verified:",m.version,p.join(","))'
